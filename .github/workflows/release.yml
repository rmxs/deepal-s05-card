name: Release

# Creates a GitHub release automatically whenever CARD_VERSION in src/00_head.js
# is bumped on main (tag = v<CARD_VERSION>). Notes come from CHANGELOG.md.
# A version with a suffix (e.g. 1.4.0-beta.1) is published as a pre-release, so it is not offered as the latest version.
on:
  push:
    branches: [main]
    paths:
      - "src/00_head.js"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: bash scripts/build.sh
      - name: Release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(grep -oP 'CARD_VERSION = "\K[^"]+' src/00_head.js)"
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do"
            exit 0
          fi
          awk -v ver="$v" '$0 ~ "^## "ver"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $tag" > notes.md
          # ΣΗΜΑΝΤΙΚΟ: το release ΔΕΝ έχει συνημμένα αρχεία. Αν είχε το deepal-s05-card.js, το HACS θα κατέβαζε
          # μόνο αυτό (χωρίς τους φακέλους lang/ και images/). Χωρίς συνημμένα, κατεβάζει όλο το dist/.
          pre=""
          case "$v" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" $pre --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
